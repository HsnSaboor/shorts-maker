[project]
name = "ai-shorts-generator"
version = "1.0.0"
description = "AI Shorts Generator - God-tier CLI for local video clipping"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "youtube-transcript-api>=0.6.2",
    "yt-dlp>=2024.3.10",
    "opencv-python>=4.8.0",
    "deepgram-sdk>=3.0.0",
    "pydub>=0.25.0",
    "rich>=13.0.0",
]

[project.scripts]
ai-shorts = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"